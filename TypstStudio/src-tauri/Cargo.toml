[package]
name = "typst-studio"
version = "0.1.0"
description = "Typst Studio — Realtime Lightweight Desktop & Web App"
authors = ["The Typst Studio Developers"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"

[workspace]

[lib]
name = "typst_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
zip = "9.4.1"
rfd = "0.17.2"
base64 = "0.23.1"
arboard = "3.4"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
