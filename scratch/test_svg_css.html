<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #333; }
  .BlackPageMode .PageSheet svg [fill="#000000"],
  .BlackPageMode .PageSheet svg [fill="#000"],
  .BlackPageMode .PageSheet svg [fill="black"] {
      fill: #e8e8ec !important;
  }
  .BlackPageMode .PageSheet svg [fill="#ffffff"],
  .BlackPageMode .PageSheet svg [fill="#fff"],
  .BlackPageMode .PageSheet svg [fill="white"] {
      fill: #121215 !important;
  }
  .BlackPageMode .PageSheet svg [fill="#555555"],
  .BlackPageMode .PageSheet svg [fill="#555"] {
      fill: #a0a0a8 !important;
  }
  .BlackPageMode .PageSheet svg [fill="#666666"],
  .BlackPageMode .PageSheet svg [fill="#666"] {
      fill: #b0b0b8 !important;
  }
  .BlackPageMode .PageSheet svg [stroke="#000000"],
  .BlackPageMode .PageSheet svg [stroke="#000"] {
      stroke: #e8e8ec !important;
  }
  .BlackPageMode .PageSheet svg [stroke="#333333"] {
      stroke: #888890 !important;
  }
  .BlackPageMode .PageSheet svg [stroke="#cccccc"] {
      stroke: #44444c !important;
  }
</style>
</head>
<body>
<div id="container" class="BlackPageMode">
  <div class="PageSheet">
    <!-- SVG will be placed here -->
  </div>
</div>
</body>
</html>
